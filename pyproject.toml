[project]
name = "kajibalance"
version = "0.1.0"
description = "見えない家事を可視化し、夫婦の負担を公平にする家事分担アプリ"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.0",
    "pandas>=2.0",
    "altair>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
